<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g id="icon" filter="url(#softShadow)">
    <!-- Left swatch -->
    <rect x="196" y="120" width="120" height="290" rx="32" ry="32"
          fill="#93c5fd" opacity="0.92"
          transform="rotate(-30 256 410)" />
    <!-- Middle swatch -->
    <rect x="196" y="120" width="120" height="290" rx="32" ry="32"
          fill="#3b82f6"
          transform="rotate(0 256 410)" />
    <!-- Right swatch -->
    <rect x="196" y="120" width="120" height="290" rx="32" ry="32"
          fill="#1d4ed8" opacity="0.92"
          transform="rotate(30 256 410)" />
  </g>
</svg>